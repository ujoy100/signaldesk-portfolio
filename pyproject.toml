[project]
name = "telecom-agentic-ai-support"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.0,<2.0",
    "deepagents>=0.2,<1.0",
    "fastapi>=0.151.0",
    "httpx>=0.28.1",
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.0,<4.0",
    "mcp>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.0,<3.0",
    "qdrant-client>=1.14,<2.0",
    "rank-bm25>=0.2,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
evaluation = [
    "ragas>=0.3,<0.5",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.0.0,<3.0.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
