name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "true"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  backend:
    name: Backend, PostgreSQL, Qdrant, migrations and evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: telecom_test_db
          POSTGRES_USER: telecom_test
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telecom_test -d telecom_test_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.15.5
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c '</dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: testing
      DATABASE_URL: postgresql+psycopg://telecom_test:ci-only-postgres-password@127.0.0.1:5432/telecom_test_db
      TEST_DATABASE_URL: postgresql+psycopg://telecom_test:ci-only-postgres-password@127.0.0.1:5432/telecom_test_db
      QDRANT_URL: http://127.0.0.1:6333
      AUTH_JWT_SECRET: ci-only-jwt-secret-with-sufficient-entropy
      AUTH_JWT_AUDIENCE: telecom-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install project Python
        run: uv python install 3.13
      - name: Install locked Python dependencies
        run: uv sync --frozen --extra evaluation
      - name: Ruff lint and formatting
        run: |
          uv run ruff check backend
          uv run ruff format --check backend
      - name: Upgrade isolated test schema
        run: uv run alembic upgrade head
      - name: Provision LangGraph checkpoint schema
        run: uv run python -m backend.scripts.setup_checkpoints
      - name: Verify Alembic head and consistency
        run: |
          uv run alembic current
          uv run alembic heads
          uv run alembic check
      - name: Run backend regression suite
        run: uv run pytest backend/tests -q
      - name: Run deterministic evaluation gate
        run: uv run python -m backend.scripts.run_deterministic_evaluation
      - name: Verify dependency lock
        run: uv lock --check
      - name: Audit production Python dependencies
        run: |
          uv export --quiet --frozen --no-dev --no-emit-project --output-file /tmp/signaldesk-production-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --disable-pip --require-hashes -r /tmp/signaldesk-production-requirements.txt

  frontend:
    name: Frontend lint, tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit browser and development dependencies
        run: npm audit --audit-level=moderate

  security:
    name: Secret and dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan repository for committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          detect --source=/repo --redact --config=/repo/.gitleaks.toml
      - name: Review pull-request dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  container-builds:
    name: Reproducible backend and frontend images
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate Compose model without development secrets
        run: |
          mkdir -p secrets
          printf '%s' 'ci-only-compose-password' > secrets/postgres_password.txt
          printf '%s' 'ci-only-compose-jwt-secret-with-sufficient-entropy' > secrets/auth_jwt_secret.txt
          docker compose config --quiet
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          load: true
          tags: signaldesk-backend:ci
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          file: frontend/Dockerfile
          load: true
          tags: signaldesk-frontend:ci
          push: false
          build-args: VITE_API_BASE_URL=http://localhost:8000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build isolated evaluation image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          target: evaluation
          push: false
          cache-from: type=gha,scope=evaluation
          cache-to: type=gha,mode=max,scope=evaluation
      - name: Audit runtime image OS and application packages
        run: |
          status=0
          for image in signaldesk-backend:ci signaldesk-frontend:ci; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /tmp/trivy-cache:/root/.cache/trivy \
              aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
              image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
              --no-progress "$image" || status=1
          done
          exit "$status"
