name: Browser acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: signaldesk-browser-ci
  COMPOSE_FILE: compose.yaml:compose.acceptance.yaml

jobs:
  playwright-compose:
    name: Playwright with real Compose stack
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create ephemeral CI-only Compose secrets
        run: |
          mkdir -p secrets
          printf '%s' 'ci-only-compose-password' > secrets/postgres_password.txt
          printf '%s' 'ci-only-compose-jwt-secret-with-sufficient-entropy' > secrets/auth_jwt_secret.txt
          chmod 600 secrets/*.txt
      - name: Start isolated stack
        run: docker compose up -d --build --wait
      - name: Verify every backend service uses the same runtime image
        run: |
          python3 - <<'PYTHON'
          import json
          import subprocess
          services = ["backend", "migrate", "checkpoints"]
          ids = []
          for service in services:
              container = subprocess.check_output(["docker", "compose", "ps", "-a", "-q", service], text=True).strip()
              ids.append(json.loads(subprocess.check_output(["docker", "inspect", container], text=True))[0]["Image"])
          assert len(set(ids)) == 1, "Backend startup services use different runtime images"
          print("API, migrations and checkpoints use the same runtime image")
          PYTHON
      - name: Seed fictional acceptance data
        run: docker compose --profile tools run --rm seed
      - name: Verify live HTTP authorization, approvals, publication and exactly-once execution
        run: docker compose exec -T backend python -m backend.scripts.verify_compose_acceptance
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Confirm hosted Chrome availability
        run: google-chrome --version
      - name: Run real browser acceptance
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npm run test:e2e
      - name: Retain only fictional demo screenshots
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fictional-demo-screenshots-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            docs/screenshots/signaldesk-login.png
            docs/screenshots/phase15-support.png
            docs/screenshots/phase15-approval.png
            docs/screenshots/phase15-knowledge.png
            docs/screenshots/phase15-feedback.png
            docs/screenshots/phase15-mobile.png
      - name: Record service state
        if: always()
        run: docker compose ps
      - name: Stop stack without deleting volumes
        if: always()
        run: docker compose down
